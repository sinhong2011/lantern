name: Lantern
options:
  bundleIdPrefix: app.lantern
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Lantern:
    type: application
    platform: macOS
    sources:
      - path: Lantern
        excludes:
          - "**/*.md"
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lantern.Lantern
        PRODUCT_NAME: Lantern
        INFOPLIST_FILE: Lantern/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.2.0" # x-release-please-version
        CURRENT_PROJECT_VERSION: "0.2.0" # x-release-please-version
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_ENTITLEMENTS: Lantern/Lantern.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Lantern/Lantern.debug.entitlements
          ENABLE_LIBRARY_VALIDATION: NO
    info:
      path: Lantern/Info.plist
      properties:
        CFBundleDisplayName: Lantern
        CFBundleName: Lantern
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SUFeedURL: https://github.com/sinhong2011/lantern/releases/latest/download/appcast.xml
        SUPublicEDKey: S5lqsg8xzCy3XxmEzV9TnfOaVHwIz53f+BB2rDJNIJk=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
